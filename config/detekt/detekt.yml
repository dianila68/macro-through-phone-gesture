build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# Complexity rules — tuned for Android where some functions are necessarily long
# (Compose composables, when-expression dispatch, state-machine branches).
complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 5            # sensor condition combinators (All/Any/Not) kept below this
  LongMethod:
    active: true
    threshold: 90           # Compose screens + state-machine branches can exceed 80
  LongParameterList:
    active: true
    threshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 5
    thresholdInObjects: 12
    thresholdInEnums: 5
  CyclomaticComplexMethod:
    active: true
    threshold: 22           # FallDetector state machine and EnvelopeBuilder are inherently complex
  NestedBlockDepth:
    active: true
    threshold: 5
  NamedArguments:
    active: true
    threshold: 5

# Coroutines — flag suspend-function and context mistakes
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

# Empty blocks catch common "forgot to handle" mistakes
empty-blocks:
  active: true

# Exception handling
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Throwable
    allowedExceptionNameRegex: '_|(ignore|Ignore|expected|Expected)'
  SwallowedException:
    active: true

# Naming rules
naming:
  active: true
  FunctionNaming:
    active: true
    # Compose @Composable functions use PascalCase by convention
    functionPattern: '[a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'
    privateVariablePattern: '_?[a-z][a-zA-Z0-9]*'

# Performance rules
performance:
  active: true
  ArrayPrimitive:
    active: true
  SpreadOperator:
    active: true
    # SampleBuffer and RecordedGestureDetector use spread for vararg pass-through
    excludes: ['**/recording/**', '**/data/**']

# Potential bugs
potential-bugs:
  active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true

# Style
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'     # countdown seconds
      - '4'
      - '5'
      - '10'
      - '15'    # countdown seconds
      - '16'    # 16ms animation frame (~60 fps)
      - '50'    # EnvelopeBuilder GRID_POINTS
      - '80'    # FallDetector free-fall window ms
      - '100'   # EngineMetrics LATENCY_WINDOW; resource meter max
      - '500'   # SampleBuffer capacity; common delay_after_ms
      - '1500'  # RecordedGestureDetector MIN_COOLDOWN_MS
      - '2000'  # common cooldown_ms
      - '2500'  # FallDetector magnitude threshold * 100
      - '3000'  # RepetitionScorer max duration ms
      - '5000'  # action window timeout ms
      - '20000' # proximity-wave cooldown ms
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
  ReturnCount:
    active: true
    max: 5      # Executors and validators have early-return guard clauses
    excludedFunctions:
      - 'equals'
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'
  ForbiddenComment:
    active: true
    comments:
      - 'FIXME:'
      - 'STOPSHIP:'
    allowedPatterns: ''
  MaxLineLength:
    active: true
    maxLineLength: 140    # wider than default 120; long sensor-condition chains are readable
    excludeImportStatements: true
    excludeCommentStatements: true
