name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Gradle project lands with ticket-001. Until ./gradlew exists,
      # CI skips the build steps instead of failing the whole pipeline.
      - name: Check for Gradle wrapper
        id: gradle-check
        run: |
          if [ -f ./gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle wrapper found — skipping build and lint (pending ticket-001-gradle-scaffolding)."
          fi

      - name: Build
        if: steps.gradle-check.outputs.exists == 'true'
        run: ./gradlew build --stacktrace

      - name: Lint
        if: steps.gradle-check.outputs.exists == 'true'
        run: ./gradlew lint

      - name: Upload lint reports
        if: steps.gradle-check.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
